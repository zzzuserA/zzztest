<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>危局HP逆算</title><style>
:root{color-scheme:dark;--bg:#101218;--panel:#1c212b;--line:#434c59;--text:#f5f6f8;--muted:#b4becb;--accent:#80d8e9;--yellow:#f9d345}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif}button,input,select{font:inherit}main{max-width:1100px;margin:auto;padding:16px 12px 70px}.head{position:relative;padding:18px 20px;border:1px solid var(--accent);border-radius:12px;background:var(--panel)}.head h1{margin:0;font-size:clamp(24px,5vw,34px)}.head p{color:var(--muted);margin:6px 0 0}.back{position:absolute;right:18px;top:18px;color:white;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px}.head h1,.head p{padding-right:125px}.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0}.controls label{font-size:13px;color:var(--muted);font-weight:700}.controls input,.controls select{display:block;width:100%;margin-top:6px;background:#151922;color:white;border:1px solid #65707e;border-radius:8px;padding:10px;min-height:44px}.controls input:focus,.controls select:focus,.back:focus-visible{outline:2px solid var(--accent)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px}.stat span{display:block;font-size:12px;color:var(--muted)}.stat strong{display:block;margin-top:7px;font-size:clamp(20px,3vw,29px);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.stat.primary{border-color:var(--yellow)}.stat.primary strong{color:var(--yellow)}.detail{line-height:1.65;color:var(--muted);font-size:13px;margin:17px 2px 25px}.detail strong{color:white}.tableWrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}table{border-collapse:collapse;width:100%;min-width:650px;font-variant-numeric:tabular-nums}th,td{padding:9px 12px;text-align:right;border-bottom:1px solid #3c444f}th:first-child,td:first-child{text-align:center}thead th{background:#193bc4;color:white;font-size:13px;white-space:nowrap}tbody tr:nth-child(even){background:#232a34}tbody tr.current{background:#4a4224}tbody tr.done td{color:#9da8b5}tbody tr:last-child td{border-bottom:0}.bar{height:8px;border-radius:9px;background:#363e48;margin:12px 0;overflow:hidden}.bar div{height:100%;background:var(--yellow)}.caption{color:var(--muted);font-size:12px;margin:15px 2px}.error{color:#ffb49d;min-height:20px;font-size:13px}@media(max-width:740px){.controls,.summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){.head{padding:15px}.head h1,.head p{padding-right:0}.head p{margin-top:44px}.back{top:auto;bottom:48px;right:15px}.controls{gap:9px}.stat{padding:11px}.stat strong{font-size:20px}}

@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap');
:root{--bg:#141414;--panel:#101010;--line:#414141;--text:#f7f7f2;--muted:#bcbcbc;--accent:#f0eb00;--yellow:#f0eb00}
body{background:repeating-linear-gradient(135deg,#171717 0 3px,#141414 3px 7px);font-family:'Zen Kaku Gothic New','Noto Sans JP',system-ui,sans-serif;font-weight:500}
main{max-width:1180px;padding:24px 10px 40px}
.head{position:relative;isolation:isolate;overflow:visible;padding:24px;margin-bottom:10px;border:3px solid #555;border-radius:28px;background:linear-gradient(115deg,rgba(255,255,255,.05) 0 19%,transparent 19% 100%),linear-gradient(115deg,transparent 0 27%,rgba(0,0,0,.30) 27% 48%,transparent 48% 100%),repeating-linear-gradient(135deg,rgba(255,255,255,.045) 0 2px,transparent 2px 8px),linear-gradient(115deg,#0a0a0a 0%,#1b1b1d 38%,#101113 60%,#090909 100%);box-shadow:7px 7px 0 #050505,inset 0 0 0 5px #151515}
.head::before{content:'ZENLESS ZONE ZERO / DEADLY ASSAULT HP';position:absolute;top:20px;left:22px;max-width:calc(100% - 95px);padding:8px 28px 8px 18px;background:#f0eb00;color:#080808;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);font-size:11px;font-weight:900;letter-spacing:.14em;line-height:1.4}
.head h1{display:block;width:fit-content;max-width:100%;margin:46px 0 12px;padding:0 0 0 15px;border-left:6px solid #f0eb00;font-size:clamp(23px,3.1vw,38px);font-weight:900;line-height:1.45;letter-spacing:.03em;color:#080808;text-shadow:-1px -1px 0 #fff,0 -1px 0 #fff,1px -1px 0 #fff,-1px 0 0 #fff,1px 0 0 #fff,-1px 1px 0 #fff,0 1px 0 #fff,1px 1px 0 #fff,3px 4px 0 #000}
.head p{padding:0;margin:0;color:#bcbcbc}
.hpMenu{position:absolute;right:12px;top:10px;z-index:20}.hpMenu summary{list-style:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:45px;height:45px;padding:8px;border:2px solid #fff;border-radius:12px;background:#15171b;cursor:pointer;box-shadow:0 0 0 1px #777}.hpMenu summary::-webkit-details-marker{display:none}.hpMenu summary span{display:block;flex:none;width:24px;min-width:24px;height:3px;min-height:3px;border-radius:5px;background:white}.hpMenu summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.hpMenu nav{position:absolute;right:0;top:calc(100% + 8px);min-width:155px;padding:5px;background:#181b24;border:1px solid var(--accent);border-radius:9px;box-shadow:0 8px 24px #0008}.hpMenu nav a{display:block;padding:10px;color:white;text-decoration:none;white-space:nowrap;border-radius:5px;font-weight:700}.hpMenu nav a:hover,.hpMenu nav a:focus-visible{background:#2b3544}
.controls{gap:10px;margin:20px 0 10px}.controls input,.controls select{background:#101010;border:2px solid #414141;border-radius:24px;color:#f7f7f2;font-weight:700}.controls input:focus,.controls select:focus{outline-color:#f0eb00}.stat{background:#202020;border:2px solid #414141;border-radius:20px}.stat.primary{border-color:#f0eb00}.stat.primary strong{color:#f0eb00}.tableWrap{border:2px solid #414141;border-radius:20px;background:#202020}thead th{background:#373600;color:#f0eb00}tbody tr:nth-child(even){background:#262626}tbody tr.current{background:#373600}.bar div{background:#f0eb00}
@media(max-width:560px){main{padding:10px 10px 30px}.head{padding:20px 10px;border-radius:22px}.head::before{top:10px;left:10px;max-width:calc(100% - 85px);padding:7px 20px 7px 14px;font-size:10px;letter-spacing:.08em}.head h1{margin:44px 0 12px;padding-left:11px;border-left-width:5px;font-size:24px}.head p{margin:0}.hpMenu{right:10px;top:10px}}
.hpMenu summary{display:grid;place-items:center;gap:0;padding:0}.hpMenu .menuIcon{display:block;flex:none;width:28px;height:28px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}</style></head><body><main><header class="head"><h1>危局HP逆算</h1><p>攻撃前後のスコアとダメージから、ボスの総HPを推定</p><details class="hpMenu"><summary aria-label="メニューを開く"><svg class="menuIcon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M4 6H28M4 16H28M4 26H28"/></svg></summary><nav aria-label="関連ページ"><a href="../">チームビルダー</a></nav></details></header><section class="controls" aria-label="逆算条件"><label>危局モード<select id="preset"><option value="2026">逆境（24ゲージ）</option><option value="2025">試練（29ゲージ）</option></select></label><label>攻撃前の合計スコア<input id="before" type="number" min="0" step="1" inputmode="numeric" placeholder="例: 10000"></label><label>攻撃後の合計スコア<input id="after" type="number" min="0" step="1" inputmode="numeric" placeholder="例: 15000"></label><label>その攻撃のダメージ量<input id="attack" type="number" min="1" step="1" inputmode="numeric" placeholder="例: 1000000"></label><label>両時点の操作スコア<input id="operation" type="number" min="0" step="1" inputmode="numeric" value="5000"></label></section><div class="error" id="error" role="status"></div><section class="summary"><div class="stat primary"><span>推定・ボス総HP</span><strong id="total">—</strong></div><div class="stat"><span>攻撃前の残りHP</span><strong id="remainingBefore">—</strong></div><div class="stat"><span>攻撃後の残りHP</span><strong id="remainingAfter">—</strong></div><div class="stat"><span>攻撃で削った割合</span><strong id="fraction">—</strong></div></section><p class="detail" id="detail">3つの数値を入力してください。攻撃前後の操作スコアが同じ場合に計算できます。</p><div class="tableWrap"><table><thead><tr><th>残りHPゲージ</th><th>HP割合</th><th>総HP比</th><th>ダメージスコア</th><th>累計スコア</th></tr></thead><tbody id="rows"></tbody></table></div><p class="caption">提示された2026/07/29、2025/08/21の検証画像に基づくHP配分とスコアです。スコアから削ったHPの割合を逆算し、攻撃ダメージをその割合で割ります。整数スコアは四捨五入されているため、総HPは推定値です。操作スコアが攻撃中に増減した場合は正確に逆算できません。非公式ツールです。</p></main><script>
const presets={2026:[[24,21,9,395,750],[20,17,9,395,1000],[16,15,9,395,1500],[14,12,3,79,3500],[11,11,3,79,3500],[10,10,4,79,3500],[9,3,5,79,3500],[2,1,5,79,4000]],2025:[[29,26,6,437,1000],[25,22,17,874,1200],[21,18,11,437,1800],[17,14,25,874,2400],[13,10,15,437,2600],[9,7,25,437,2600],[6,1,25,437,2700]]};const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('ja-JP',{maximumFractionDigits:2}).format(n);const fields=['preset','before','after','attack','operation'];try{const saved=JSON.parse(localStorage.getItem('zzz-deadly-hp-inverse-v1'));if(saved)for(const id of fields)if(saved[id]!=null)$(id).value=saved[id]}catch{}function rowsFor(p){const a=[];for(const [hi,lo,num,den,points]of presets[p])for(let gauge=hi;gauge>=lo;gauge--)a.push({gauge,num,den,points,share:num/den});return a}function fractionAtScore(score,rows){let used=0,share=0;for(const row of rows){if(score<=used+row.points)return share+Math.max(0,score-used)/row.points*row.share;used+=row.points;share+=row.share}return 1}function calculate(){const rows=rowsFor($('preset').value),before=Number($('before').value),after=Number($('after').value),attack=Number($('attack').value),operation=Number($('operation').value);let cum=0,html='';for(const row of rows){cum+=row.points;html+='<tr><td>'+row.gauge+'</td><td>'+row.num+'/'+row.den+'</td><td>'+fmt(row.share*100)+'%</td><td>'+fmt(row.points)+'</td><td>'+fmt(cum)+'</td></tr>'}$('rows').innerHTML=html;const valid=fields.slice(1).every(id=>$(id).value!=='')&&Number.isFinite(before)&&Number.isFinite(after)&&Number.isFinite(attack)&&Number.isFinite(operation)&&attack>0&&operation>=0&&before>=operation&&after>before&&after-operation<=60000;let err='';if(fields.slice(1).some(id=>$(id).value===''))err='';else if(before<operation)err='攻撃前スコアが操作スコアより小さくなっています。';else if(after<=before)err='攻撃後スコアは攻撃前より大きい数値にしてください。';else if(after-operation>60000)err='ダメージスコアは60,000が上限です。操作スコアを確認してください。';else if(attack<=0)err='攻撃ダメージは0より大きい数値にしてください。';const f0=valid?fractionAtScore(before-operation,rows):0,f1=valid?fractionAtScore(after-operation,rows):0,delta=f1-f0,total=valid&&delta>0?attack/delta:0;$('error').textContent=err;$('total').textContent=total?fmt(total):'—';$('remainingBefore').textContent=total?fmt((1-f0)*total):'—';$('remainingAfter').textContent=total?fmt((1-f1)*total):'—';$('fraction').textContent=total?fmt(delta*100)+'%':'—';$('detail').textContent=total?'ダメージスコア '+fmt(before-operation)+' → '+fmt(after-operation)+'。ボス総HP ≈ '+fmt(attack)+' ÷ '+fmt(delta*100)+'%。':'3つの数値を入力してください。攻撃前後の操作スコアが同じ場合に計算できます。';try{localStorage.setItem('zzz-deadly-hp-inverse-v1',JSON.stringify(Object.fromEntries(fields.map(id=>[id,$(id).value]))))}catch{}}for(const id of fields)$(id).addEventListener('input',calculate);calculate();
</script></body></html>
